
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câu 15 - Xây dựng Tabs</title>

    <!-- Thư viện jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Phần tiêu đề trang */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            padding: 8px;
            border-bottom: 1px solid #7da6ff;
        }

        .header-title {
            background-color: #c9570b;
            color: white;
            padding: 6px 15px;
            min-width: 142px;
        }

        .teacher {
            margin-right: 20px;
        }

        /* Khung chứa tabs */
        .tabs-container {
            width: 430px;
            margin: 8px auto;
            border: 1px solid #ccc;
        }

        /* Thanh màu xanh lá */
        .tabs-menu {
            display: flex;
            align-items: end;
            gap: 4px;
            background-color: #a9e94d;
            padding: 4px 0 0 0;
        }

        /* Nút tab */
        .tab {
            padding: 10px 18px;
            background-color: #339bc5;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px 10px 0 0;
            font-size: 13px;
            white-space: nowrap;
        }

        /* Tab đang được chọn */
        .tab.active {
            background-color: white;
            color: #3333ff;
            border-top: 3px solid #a9e94d;
            padding-top: 7px;
        }

        /* Nội dung tab */
        .tab-content {
            display: none;
            padding: 18px;
            min-height: 50px;
            font-size: 14px;
            background-color: white;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Tiêu đề -->
    <div class="header">
        <div class="header-title">THIẾT KẾ WEB</div>
        <div class="teacher">GV: Nguyễn Thiện Dương</div>
    </div>

    <!-- Khu vực tabs -->
    <div class="tabs-container">

        <!-- Các nút tab -->
        <div class="tabs-menu">
            <button class="tab active" data-tab="thongtin">
                THÔNG TIN CHÍNH
            </button>

            <button class="tab" data-tab="hinhanh">
                HÌNH ẢNH
            </button>

            <button class="tab" data-tab="seo">
                SEO
            </button>
        </div>

        <!-- Nội dung tab 1 -->
        <div id="thongtin" class="tab-content active">
            Tab thông tin chính
        </div>

        <!-- Nội dung tab 2 -->
        <div id="hinhanh" class="tab-content">
            Tab hình ảnh
        </div>

        <!-- Nội dung tab 3 -->
        <div id="seo" class="tab-content">
            Tab SEO
        </div>

    </div>

    <script>
        $(document).ready(function () {

            // Xử lý khi người dùng click vào tab
            $(".tab").click(function () {

                // Xóa trạng thái active của tất cả tab
                $(".tab").removeClass("active");

                // Thêm active cho tab vừa được click
                $(this).addClass("active");

                // Ẩn tất cả nội dung tab
                $(".tab-content").removeClass("active");

                // Lấy id nội dung tương ứng với tab
                var tabId = $(this).data("tab");

                // Hiển thị nội dung tab được chọn
                $("#" + tabId).addClass("active");

            });

        });
    </script>

</body>
</html>
